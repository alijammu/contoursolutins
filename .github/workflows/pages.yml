name: Deploy GitHub Pages

# Run manually after selecting GitHub Actions in Settings > Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Pages URL settings
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: node tools/build.mjs
      - name: Check pages
        run: node tools/check.mjs
      - name: Export for Pages URL
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tools/export-pages.mjs --base=${BASE_PATH%/}/
      - name: Check export
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tools/check-pages-export.mjs ${BASE_PATH%/}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
